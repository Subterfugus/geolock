name: Desktop app

# Builds the GeoLock Windows installer:
#   assets   (Linux)   small model assets + the pinned CLIP download, checked against PyTorch
#   windows  (Windows) frozen Python backend, smoke test with the real model, Tauri + NSIS installer
# Runs only on pushes to main (and by hand), where it gates the release: it publishes the
# installer as a GitHub release (v<version>), once per version; an existing release is
# never overwritten. Pull requests get the quick checks in tests.yml instead.

on:
  push:
    branches: [main]
    paths-ignore: ["info.md", "README.md", "docs/**"]
  workflow_dispatch:

# Builds of main always finish, because each one publishes the release.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: geolock/desktop/bundled
          key: assets-v2-${{ hashFiles('geolock/prompts.py', 'tools/build_postcodes.py', 'geolock/data/countries.geojson', 'tools/build_app_assets.py', 'geolock/desktop/modelsetup.py', 'geolock/setup_models.py', 'geolock/config.py') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - name: Build assets
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers huggingface_hub openvino numpy pillow shapely scipy
          pip install geoclip --no-deps
          python tools/build_app_assets.py
          # GeoNames postcodes (CC BY 4.0) for the address reader
          curl -fsSL -o /tmp/allCountries.zip https://download.geonames.org/export/zip/allCountries.zip
          python tools/build_postcodes.py /tmp/allCountries.zip geolock/desktop/bundled/postcodes.npz
      - run: ls -la geolock/desktop/bundled && cat geolock/desktop/bundled/assets.json
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-assets
          path: geolock/desktop/bundled
          retention-days: 7

  windows:
    needs: assets
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundled-assets
          path: geolock/desktop/bundled
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Unit tests (device choice and CPU fallback)
        run: pip install pytest && python -m pytest -q tests/test_devices.py
      - name: Bundle the OCR models
        run: |
          # Some runner CPUs have crashed here with "Illegal instruction": name the CPU and
          # the module that crashed, since users' CPUs could hit the same thing.
          powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List Name, Manufacturer, NumberOfCores"
          python -X faulthandler -c "from geolock.setup_models import prefetch_ocr; prefetch_ocr()"
      - name: Freeze the backend
        run: pyinstaller --noconfirm --distpath desktop/backend-dist --workpath build/pyinstaller desktop/backend/geolock-backend.spec
      - name: Smoke test (real first-run download, then locate a photo)
        run: python tools/desktop_smoke.py desktop/backend-dist/geolock-backend/geolock-backend.exe
      - run: du -sh desktop/backend-dist/geolock-backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build the installer
        working-directory: desktop/src-tauri
        run: |
          npm --prefix ../ui ci
          npm ci
          npm run tauri -- build --config tauri.bundle.conf.json
      - name: Collect the installer
        id: out
        run: |
          f=$(ls desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          ls -la "$f"
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c 'import geolock; print(geolock.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Install and run the app (silent install, first run, locate, screenshots)
        shell: pwsh
        run: ./tools/installer_test.ps1 -Setup "${{ steps.out.outputs.file }}" -Shots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-test-screenshots
          path: screenshots
          retention-days: 14
      - name: Share the screenshots on the ci-screenshots branch
        if: always() && hashFiles('screenshots/*.png') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Installer test screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: GeoLock-installer
          path: ${{ steps.out.outputs.file }}
          retention-days: 30
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.out.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Never replace a published installer: bump the version to publish a new one.
            echo "Release $tag already exists; leaving its installer as it is."
          else
            notes="docs/releases/$tag.md"
            [ -f "$notes" ] || { echo "Windows installer. Download, run, and GeoLock appears in the Start menu. On first launch it downloads the CLIP model once (about 600 MB)." > "$RUNNER_TEMP/notes.md"; notes="$RUNNER_TEMP/notes.md"; }
            # latest.json tells installed apps about this release (Settings > Updates).
            python tools/update_manifest.py --installer "${{ steps.out.outputs.file }}" \
              --version "${{ steps.out.outputs.version }}" --repo "$GITHUB_REPOSITORY" \
              --notes "$notes" --out "$RUNNER_TEMP/latest.json"
            gh release create "$tag" "${{ steps.out.outputs.file }}" "$RUNNER_TEMP/latest.json" \
              --title "GeoLock $tag" --notes-file "$notes" --target "$GITHUB_SHA" --latest
          fi
