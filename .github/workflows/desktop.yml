name: Desktop app

# Builds the GeoLock Windows installer:
#   assets   (Linux)   small model assets + the pinned CLIP download, checked against PyTorch
#   windows  (Windows) frozen Python backend, smoke test with the real model, Tauri + NSIS installer
# Pushes to main also publish the installer as a GitHub release (v<version>).

on:
  push:
    branches: [main]
    paths-ignore: ["info.md", "README.md", "docs/**"]
  pull_request:
    paths-ignore: ["info.md", "README.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: geolock/desktop/bundled
          key: assets-v1-${{ hashFiles('geolock/prompts.py', 'geolock/data/countries.geojson', 'tools/build_app_assets.py', 'geolock/desktop/modelsetup.py', 'geolock/setup_models.py', 'geolock/config.py') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - name: Build assets
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers huggingface_hub openvino numpy pillow shapely scipy
          pip install geoclip --no-deps
          python tools/build_app_assets.py
      - run: ls -la geolock/desktop/bundled && cat geolock/desktop/bundled/assets.json
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-assets
          path: geolock/desktop/bundled
          retention-days: 7

  windows:
    needs: assets
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundled-assets
          path: geolock/desktop/bundled
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Bundle the OCR models
        run: python -c "from geolock.setup_models import prefetch_ocr; prefetch_ocr()"
      - name: Freeze the backend
        run: pyinstaller --noconfirm --distpath desktop/backend-dist --workpath build/pyinstaller desktop/backend/geolock-backend.spec
      - name: Smoke test (real first-run download, then locate a photo)
        run: python tools/desktop_smoke.py desktop/backend-dist/geolock-backend/geolock-backend.exe
      - run: du -sh desktop/backend-dist/geolock-backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build the installer
        working-directory: desktop/src-tauri
        run: |
          npm --prefix ../ui ci
          npm ci
          npm run tauri -- build --config tauri.bundle.conf.json
      - name: Collect the installer
        id: out
        run: |
          f=$(ls desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          ls -la "$f"
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c 'import geolock; print(geolock.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: GeoLock-installer
          path: ${{ steps.out.outputs.file }}
          retention-days: 30
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.out.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.out.outputs.file }}" --clobber
          else
            gh release create "$tag" "${{ steps.out.outputs.file }}" --title "GeoLock $tag" \
              --notes "Windows installer. Download, run, and GeoLock appears in the Start menu. On first launch it downloads the CLIP model once (about 600 MB)." \
              --target "$GITHUB_SHA"
          fi
