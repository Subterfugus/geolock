name: Tests

# Fast Python checks for the Claude / ChatGPT second opinion. Uses fake `claude` and
# `codex` commands only: never a real Claude or ChatGPT call.

on:
  push:
    branches: [main]
    paths: ["geolock/**", "tests/**", "pyproject.toml", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["geolock/**", "tests/**", "pyproject.toml", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  analyst:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - run: python -m pytest -q tests/test_analyst.py
