name: Tests

# Quick checks for pull requests: Python tests for the Claude / ChatGPT second opinion
# and settings (fake `claude` and `codex` commands only, never a real Claude or ChatGPT
# call), plus a typecheck and build of the app UI. The slow Windows build and installer
# test runs only on main (desktop.yml).

on:
  push:
    branches: [main]
    paths: ["geolock/**", "tests/**", "pyproject.toml", "desktop/ui/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["geolock/**", "tests/**", "pyproject.toml", "desktop/ui/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyst:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - run: python -m pytest -q tests/test_analyst.py tests/test_settings.py tests/test_osm_sun.py

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - run: npm ci
        working-directory: desktop/ui
      - run: npm run build
        working-directory: desktop/ui
