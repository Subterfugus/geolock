<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoLock</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='14' r='9' fill='%233b82f6'/><circle cx='16' cy='14' r='3.5' fill='white'/><path d='M16 31 9 20h14z' fill='%233b82f6'/></svg>">
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<aside id="side">
  <header>
    <h1><span class="logo"></span>GeoLock</h1>
    <span id="device" class="badge" title="Where the AI models run">…</span>
  </header>

  <label id="drop" tabindex="0">
    <input id="file" type="file" accept="image/*" hidden>
    <img id="preview" alt="" hidden>
    <canvas id="boxes" hidden></canvas>
    <div id="drop-hint">
      <strong>Drop a photo here</strong>
      <span>or click to choose, or paste with Ctrl+V</span>
    </div>
  </label>

  <div id="options">
    <label><input type="checkbox" id="opt-ocr" checked> Read text in the photo</label>
    <label id="vlm-label" title="Uses the local vision-language model; slower but reads any script and explains more."><input type="checkbox" id="opt-vlm"> Deep analysis (vision-language model)</label>
    <label title="If the photo has GPS in its metadata, show it on the map for comparison."><input type="checkbox" id="opt-exif" checked> Show EXIF GPS if present</label>
  </div>

  <div id="busy" hidden><div class="spinner"></div><span id="busy-text">Analysing…</span></div>
  <div id="error" hidden></div>

  <section id="results" hidden>
    <div id="best"></div>
    <h2>All guesses</h2>
    <ol id="guesses"></ol>
    <h2>Country</h2>
    <div id="countries"></div>
    <h2>Clues</h2>
    <ul id="clues"></ul>
    <h2>Scene</h2>
    <div id="scene"></div>
    <details id="raw"><summary>Details</summary><div id="timings"></div><pre id="vlm-raw" hidden></pre></details>
  </section>

  <section id="history-wrap" hidden>
    <h2>This session</h2>
    <div id="history"></div>
  </section>

  <footer>Everything runs on this computer. Basemap © Natural Earth.</footer>
</aside>
<main id="map"></main>
<script src="/static/vendor/leaflet.js"></script>
<script src="/static/vendor/leaflet-heat.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
