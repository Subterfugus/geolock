[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geolock"
version = "0.4.0"
description = "Offline photo geolocation with OpenVINO: map guesses, confidence and clues"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "openvino>=2024.6",
  "numpy>=1.24",
  "pillow>=10",
  "pillow-heif>=0.16",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "shapely>=2.0",
  "scipy>=1.10",
  "reverse_geocoder>=1.5",
  "rapidocr[rtl]>=3.4",  # rtl: python-bidi, needed by the Arabic model
  "lingua-language-detector>=2.0",
]

[project.optional-dependencies]
# Only needed once, to download and convert the models.
setup = ["torch>=2.2", "transformers>=4.40", "huggingface_hub>=0.23", "nncf>=2.12"]
# Optional deep analysis with a local vision-language model.
vlm = ["openvino-genai>=2025.0", "optimum-intel[openvino]>=1.22"]
# Optional: ask Claude with an API key instead of a Claude Code login.
api = ["anthropic>=0.70"]
dev = ["pytest>=8"]

[project.scripts]
geolock = "geolock.cli:main"

[tool.setuptools.packages.find]
include = ["geolock*"]

[tool.setuptools.package-data]
geolock = ["data/*.geojson", "web/*", "web/vendor/*", "web/vendor/images/*"]
